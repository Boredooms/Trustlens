# TrustLens containers. The daily path uses the HOSTED stack (Supabase, Upstash, QStash, Clerk);
# there is no local application database. See docs/08-infrastructure/ENVIRONMENT_CONFIGURATION.md.
#
#   test-db  — isolated Postgres for the DB integration tests ONLY (profile "test", port 5433).
#              Never seed it as an app database; never point the API at it.
#                docker compose --profile test up -d test-db
#                TEST_DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5433/trustlens_test
#   api      — optional containerised API that reads the same apps/api/.env (hosted services).
services:
  test-db:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trustlens_test
    ports:
      - "5433:5432"
    volumes:
      - testdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trustlens_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    profiles: ["api"]
    build: ./apps/api
    env_file: ./apps/api/.env
    environment:
      ALLOWED_ORIGINS: http://localhost:5173
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

volumes:
  testdata:
