name: Release

# Manual only. Nothing deploys on push. Requires these repository secrets (never committed):
#   DIRECT_DATABASE_URL   Supabase session pooler (port 5432), used for `alembic upgrade head`
#   RENDER_DEPLOY_HOOK    Render deploy hook URL for trustlens-api
# The web app deploys through Vercel's Git integration (apps/web/vercel.json).
on:
  workflow_dispatch:
    inputs:
      migrate:
        description: Run alembic upgrade head before deploying the API
        type: boolean
        default: true
      deploy_api:
        description: Trigger the Render deploy hook
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  api:
    name: Migrate and deploy API
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Migrate
        if: ${{ inputs.migrate }}
        run: alembic upgrade head
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      - name: Deploy
        if: ${{ inputs.deploy_api }}
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

  extension:
    name: Package extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trustlens/extension build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_WEB_BASE_URL: ${{ vars.VITE_WEB_BASE_URL }}
          VITE_DEMO_SITES_ORIGIN: ${{ vars.VITE_DEMO_SITES_ORIGIN }}
      - run: pnpm --filter @trustlens/extension exec node scripts/check-bundle.mjs
      - name: Zip dist
        run: cd apps/extension/dist && zip -r ../../../trustlens-extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: trustlens-extension
          path: trustlens-extension.zip
