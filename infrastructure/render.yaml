# Render Blueprint for the API (DEPLOYMENT_ARCHITECTURE.md, ADR-015).
# Migrations are a release step, not a startup step: run `alembic upgrade head` against
# DIRECT_DATABASE_URL (Supabase SESSION pooler, port 5432) before deploying a new version.
services:
  - type: web
    name: trustlens-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"          # demo deployment only; logs a warning and shows the demo banner
      - key: ALLOW_DEMO_SEED
        value: "true"
      - key: DATABASE_URL          # Supabase pooler, transaction mode, port 6543
        sync: false
      - key: DIRECT_DATABASE_URL   # Supabase session pooler, port 5432 (migrations, checkpointer)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      - key: ALLOWED_ORIGINS       # https://trustlens-web.vercel.app
        sync: false
      - key: ALLOWED_ORIGIN_REGEX  # team-scoped Vercel previews (ENVIRONMENT_CONFIGURATION.md)
        value: '^https://trustlens-web(-[a-z0-9]+)?-boredooms-projects\.vercel\.app$'
      - key: SCAN_CONCURRENCY      # free plan: 512 MB, one worker (Dockerfile CMD)
        value: "2"
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_AUTHORIZED_PARTY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY   # sb_secret_… (server-only)
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: QSTASH_CURRENT_SIGNING_KEY
        sync: false
      - key: QSTASH_NEXT_SIGNING_KEY
        sync: false
      - key: CHAIN_MODE            # simulated registry in Postgres (WEB3_REGISTRY.md §7.1); demo only
        value: simulated
      - key: DEV_AUTH_ENABLED      # must stay false in production (startup refuses true)
        value: "false"
      - key: LLM_API_KEY           # optional: absent ⇒ labelled template narratives
        sync: false
      - key: LLM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: LLM_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: LLM_EXTRA_BODY        # NIM reasoning models: thinking off, or it eats the output budget
        value: '{"chat_template_kwargs":{"enable_thinking":false}}'
