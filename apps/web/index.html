<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TrustLens decides whether a website is authorised to ask for your credentials, money or personal data." />
    <title>TrustLens</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      (function () {
        try {
          var raw = localStorage.getItem("trustlens-ui");
          var theme = raw ? (JSON.parse(raw).state || {}).theme : "system";
          var dark = theme === "dark" || ((!theme || theme === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
