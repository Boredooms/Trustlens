[project]
name = "trustlens-api"
version = "0.1.0"
description = "TrustLens API — the only verdict producer"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "B008", # FastAPI's Depends() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"] # asserts, address literals and fake secrets are test data

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
# playwright is the optional deep-scan extra (requirements-deepscan.txt); absent in the default venv.
module = ["asyncpg.*", "ulid.*", "jose.*", "playwright.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Third-party only: mypy 1.16 crashes analysing langsmith (pulled in by langgraph). App code stays strict.
module = ["langsmith.*", "langchain_core.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "network: requires real network access (never in default CI)",
  "db: requires a reachable Postgres at TEST_DATABASE_URL",
]
